# Builds an installable Android APK of Marhaba on every push to main (or on demand),
# then publishes it as a GitHub Release so it can be downloaded straight to a phone.
# No Expo account or Android Studio needed: GitHub's machine does the whole build.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the Release with the APK

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17 (needed by React Native's Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching for faster builds)
        uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Check types, lint and tests
        run: |
          npx tsc --noEmit
          npx expo lint
          npm test -- --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "marhaba-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: marhaba-apk
          path: marhaba-${{ github.run_number }}.apk

      - name: Publish a Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Marhaba test build ${{ github.run_number }}
          body: |
            Android test build from commit ${{ github.sha }}.
            On your phone: download the .apk below, open it, and allow installing from your browser if asked.
            This build is signed with a test key: it installs for testing, but it is not for the Play Store.
          files: marhaba-${{ github.run_number }}.apk
          prerelease: true
